name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: rustfmt
        run: nix develop -c cargo fmt --check
      - name: clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings
      - name: test
        run: nix develop -c cargo test
      # monarchctl is a separate crate in cli/, outside the server's package.
      - name: rustfmt (monarchctl)
        run: nix develop -c cargo fmt --manifest-path cli/Cargo.toml --check
      - name: clippy (monarchctl)
        run: nix develop -c cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings
      - name: test (monarchctl)
        run: nix develop -c cargo test --manifest-path cli/Cargo.toml

  web:
    name: Web UI (svelte-check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:mock

  nix-lint:
    name: Nix (nixfmt, statix, deadnix)
    uses: pschmitt/ci-workflows/.github/workflows/nix-lint.yaml@main

  nix:
    name: Nix build + NixOS VM test (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Build
        run: nix build -L '.#monarch' '.#monarch-static' '.#monarchctl'
      - name: NixOS VM test
        run: nix build -L '.#checks.${{ matrix.system }}.nixos'

  # Native ARM packages publish to niks3 before the checks job consumes them.
  # ARM runners have no KVM, so the NixOS VM test stays in the x86_64 job above.
  nix-aarch64:
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-build.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      pin-prefix: gh-monarch-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}

  nix-aarch64-checks:
    needs: nix-aarch64
    permissions:
      contents: read
      id-token: write
    uses: pschmitt/ci-workflows/.github/workflows/nix-checks.yaml@main
    with:
      runner: ubuntu-26.04-arm
      system: aarch64-linux
      full-flake-check: false
      exclude-checks: '["nixos"]'
      pin-prefix: gh-monarch-main
    secrets:
      s3_store: ${{ secrets.NIKS3_S3_STORE }}
      s3_access_key: ${{ secrets.NIKS3_S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.NIKS3_S3_SECRET_KEY }}
