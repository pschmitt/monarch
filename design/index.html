viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="5"/></svg></span>Settings</button></nav><div class="foot">Demo operator<br><span class="meta">Account & preferences</span></div></aside><main id="content"></main></div></div>
<script>
let concept='watch',page='overview',phone=false,dark=false,settingSection='Account',selectedEventId=null,servicesQuery='',servicePages={},serviceStateFilter='all',serviceHostFilter='all',serviceTypeFilter='all',hostQuery='',hostStateFilter='all',hostGroupFilter='all',eventQuery='',eventStateFilter='all',eventHostFilter='all';const content=document.querySelector('#content');
const demo=typeof SNAPSHOT!=='undefined'?SNAPSHOT:null;
if(demo)document.querySelector('.study small').textContent='Snapshot '+new Date(demo.captured_at*1000).toLocaleString()+' · Read only';
const demoHosts=[['web-02','offline','Last seen 8 minutes ago',12],['web-01','degraded','nginx connection failed',12],['database-01','ok','Reporting normally',8],['worker-01','ok','Reporting normally',16],['backup-01','ok','Reporting normally',6]];
const hosts=()=>demo?.hosts??demoHosts.map((h,i)=>({id:i+1,hostname:h[0],state:h[1],online:h[1]!=='offline',last_seen:Date.now()/1000-480,services:{total:h[3],ok:h[3]-1,failed:h[1]==='degraded'?1:0,unmonitored:0,pending:0},failing:h[1]==='degraded'?['nginx']:[],system:{cpu:null,mem_percent:null,load:null},os:{name:'Linux',release:null}}));
const hname=h=>h.display_name||h.hostname, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(s){return ({ok:'Healthy',degraded:'Needs attention',offline:'Offline',failed:'Failed',unmonitored:'Unmonitored',pending:'Pending',init:'Starting',succeeded:'Recovered',changed:'Changed',changed_not:'No change'})[s]||s||'Unknown'}
function tone(s){return ({ok:'healthy',degraded:'warn',offline:'stale',failed:'failed',pending:'warn',unmonitored:'stale',init:'stale'})[s]||'stale'}
function stateBadge(s){return `badge state-badge state-${s==='ok'||s==='succeeded'?'ok':s==='failed'||s==='offline'?'failed':s==='pending'?'pending':s==='changed'?'changed':s==='degraded'?'warn':'stale'}`}
function stateIcon(s){const shape=s==='ok'||s==='succeeded'?'<path d="m5 12 4 4L19 6"/>':s==='failed'||s==='offline'?'<path d="m6 6 12 12M18 6 6 18"/>':s==='degraded'?'<path d="M12 3 22 20H2Z"/><path d="M12 9v4m0 3h.01"/>':s==='pending'?'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>':s==='changed'?'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 11.7-2L20 12M4 12l2.8 5a7 7 0 0 0 11.7-2"/>':'<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>';return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shape}</svg>`}
function statusBadge(s,label=status(s)){return `<span class="${stateBadge(s)}">${stateIcon(s)}<span>${esc(label)}</span></span>`}
function metricIcon(kind){const paths={CPU:'<path d="M9 4V2m6 2V2M9 22v-2m6 2v-2M4 9H2m2 6H2m20-6h-2m2 6h-2M6 6h12v12H6z"/>',Memory:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h10m-10 4h10m-10 3h5"/>',Load:'<path d="M3 18h18M5 15l4-5 3 3 6-8"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[kind]||paths.Load}</svg>`}
function shortNum(n,digits=2){return Number(n).toFixed(digits).replace(/(\.\d*?[1-9])0+$/,'$1').replace(/\.0+$/,'')}
function loadText(load,index=0){return Array.isArray(load)&&load[index]!=null?shortNum(load[index],2):'—'}
function hostExtra(h){return `<span>Kernel ${esc(h.os?.release||'—')}</span><span>Load avg ${loadText(h.system?.load,0)}</span>`}
function hostLastFacts(h){if(!h)return '';const facts=[];if(h.os?.release)facts.push(`Kernel ${h.os.release}`);if(Array.isArray(h.system?.load)&&h.system.load.some(v=>v!=null))facts.push(`Load avg ${h.system.load.filter(v=>v!=null).map(v=>shortNum(v)).join(' ')}`);return facts.length?`<small class="service-info">Last reported: ${esc(facts.join(' · '))}</small>`:''}
function hostFacts(h){const l=h.system?.load;return `<div class="host-facts"><span>Kernel · ${esc(h.os?.release||'—')}</span><span>Load avg · ${esc(loadText(l,0))} ${esc(loadText(l,1))} ${esc(loadText(l,2))}</span></div>`}
function serviceIcon(type){const paths={system:'<rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/>',filesystem:'<path d="M3 7h7l2 2h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 7V5a2 2 0 0 1 2-2h4l2 2"/>',process:'<path d="M4 19V5m0 14h16M7 15l3-4 3 2 5-7"/>',host:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>',program:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/>',file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6m-6 4h6"/>',directory:'<path d="M3 7h7l2 2h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>',fifo:'<path d="M4 7h16v10H4zM8 7V4m8 3V4m-8 16v-3m8 3v-3"/>',net:'<circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="m7 11 10-5M7 13l10 5"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[type]||paths.host}</svg>`}
function fmtKB(k){if(k==null||!Number.isFinite(Number(k)))return null;const n=Number(k);return n>=1048576?`${shortNum(n/1048576)} GB`:n>=1024?`${shortNum(n/1024)} MB`:`${shortNum(n)} KB`}
function fmtMB(m){if(m==null||!Number.isFinite(Number(m)))return null;const n=Number(m);return n>=1024?`${shortNum(n/1024)} GB`:`${shortNum(n)} MB`}
function serviceInfo(s){const d=s.data||{},rows=[];let usage=null;const put=(label,value)=>{if(value!==null&&value!==undefined&&value!=='')rows.push(`${label} ${value}`)};switch(s.type){case'filesystem':{const sp=d.space||{};put('Used',sp.percent!=null&&Number.isFinite(Number(sp.percent))?`${shortNum(sp.percent,1)}%`:null);if(sp.used_mb!=null&&sp.total_mb!=null)put('Capacity',`${fmtMB(sp.used_mb)} / ${fmtMB(sp.total_mb)}`);if(sp.percent!=null&&Number.isFinite(Number(sp.percent)))usage=Math.max(0,Math.min(100,Number(sp.percent)));put('Inodes',d.inodes?.percent!=null?`${shortNum(d.inodes.percent,1)}%`:null);break}case'process':put('CPU',d.cpu?.percent!=null?`${shortNum(d.cpu.percent,1)}%`:null);put('Memory',[fmtKB(d.memory?.kb),d.memory?.percent!=null?`${shortNum(d.memory.percent,1)}%`:null].filter(Boolean).join(' · ')||null);put('PID',d.pid);put('Uptime',d.uptime!=null?`${shortNum(d.uptime/86400,1)} days`:null);break;case'host':{const icmp=d.icmp?.[0];put('Ping',icmp?.response_ms!=null?`${shortNum(icmp.response_ms)} ms`:icmp?'Failed':null);const port=d.ports?.[0];put(port?`Port ${port.port}`:'Port',port?.response_ms!=null?`${shortNum(port.response_ms)} ms`:port?'Failed':null);break}case'program':put('Exit status',d.exit_status);put('Started',d.started?new Date(d.started*1000).toLocaleString():null);break;case'file':put('Size',d.size!=null?fmtKB(Number(d.size)/1024):null);put('Mode',d.mode);break;case'system':put('CPU',d.cpu?.total!=null?`${shortNum(d.cpu.total,1)}%`:null);put('Memory',d.memory?.percent!=null?`${shortNum(d.memory.percent,1)}%`:null);if(Array.isArray(d.load))put('Load',d.load.map(v=>shortNum(v)).join(' '));break;case'net':put('Link',d.link?.state===1?'Up':d.link?.state===0?'Down':null);break;default:put('Mode',d.mode)}return {text:rows.join(' · '),usage}}
function serviceRow(s,{stale=false}={}){const info=serviceInfo(s),state=stale?'stale':s.state,label=stale?'Stale':status(s.state);return `<a class="service-row" href="#service/${s.host_id}/${s.id}" data-service-id="${esc(s.id)}" onclick="event.preventDefault();openService(${s.host_id},this.dataset.serviceId)"><span class="service-icon">${serviceIcon(s.type)}</span><span class="service-main"><strong>${esc(s.name)}</strong><small>${esc(s.host)} · ${esc(s.type)}</small>${info.text?`<small class="service-info">${esc(info.text)}</small>`:''}${info.usage!=null?`<span class="service-meter" aria-label="${shortNum(info.usage,1)} percent used"><i style="width:${info.usage}%"></i></span>`:''}</span>${statusBadge(state,label)}<span class="service-arrow" aria-hidden="true">›</span></a>`}

function ago(ts){if(!ts)return 'Unknown last report';const m=Math.max(0,Math.floor((demo?.captured_at||Date.now()/1000)-ts));return m<60?`${m} seconds ago`:m<3600?`${Math.floor(m/60)} minutes ago`:m<86400?`${Math.floor(m/3600)} hours ago`:`${Math.floor(m/86400)} days ago`}
function eventRows(events){if(!events?.length)return '<p class="note">No events are available in this snapshot.</p>';const ordered=[...events].sort((a,b)=>b.created_at-a.created_at);let current='',html='';for(const e of ordered){const date=new Date(e.created_at*1000),day=date.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}),st=e.state,label=({ok:'Healthy',succeeded:'Recovered',failed:'Failed',pending:'Pending',unmonitored:'Unmonitored',changed:'Changed',changed_not:'No change',init:'Starting'})[st]||'Stale',toneClass=st==='ok'||st==='succeeded'?'ok':st==='failed'?'failed':st==='pending'?'pending':st==='changed'?'changed':'stale';if(day!==current){current=day;html+=`<h3 class="event-date">${esc(day)}</h3>`}html+=`<a class="event event-link" href="#event/${e.id}" onclick="event.preventDefault();openEvent(${e.id})"><time title="${date.toLocaleString()}">${date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</time><span class="event-timeline state-${toneClass}">${stateIcon(st)}</span><span class="event-main"><strong>${esc(e.message||e.kind_label||e.kind)}</strong><small>${esc([e.host,e.service].filter(Boolean).join(' · '))}</small></span><span class="event-state state-${toneClass}">${stateIcon(st)}<span>${label}</span></span></a>`}return html}
const activity=(limit=5)=>{const events=demo?.events??demo?.overview?.recent_events??[];return eventRows([...events].sort((a,b)=>b.created_at-a.created_at).slice(0,limit))};
function titleIcon(title){const paths={Hosts:'<rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/><path d="M8 6.5h.01M8 17.5h.01"/>',Services:'<path d="m5 12 4 4L19 6"/><path d="M20 12v7H4V5h11"/>',Events:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};return paths[title]?`<span class="heading-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[title]}</svg></span>`:''}
function header(title,desc,extra=''){return `<div class="top"><div><h1>${titleIcon(title)}${esc(title)}</h1><p>${esc(desc)}</p>${extra}</div><span class="live"><span class="dot"></span>${demo?`Snapshot · ${new Date(demo.captured_at*1000).toLocaleString()}`:'Demo data'}</span><span class="royal"><svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M8 43 12 17 25 29 32 10 39 29 52 17 56 43Z" fill="currentColor"/><path d="M11 52h42" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg></span></div>`}
function filteredHosts(){return hosts().filter(h=>[hname(h),h.hostname,...(h.hostgroups||[])].join(' ').toLowerCase().includes(hostQuery.toLowerCase())&&(hostStateFilter==='all'||h.state===hostStateFilter)&&(hostGroupFilter==='all'||(h.hostgroups||[]).includes(hostGroupFilter)))}
function hostFilters(){const groups=[...new Set(hosts().flatMap(h=>h.hostgroups||[]))].sort();const rows=filteredHosts();const active=hostQuery||hostStateFilter!=='all'||hostGroupFilter!=='all';return `<div class="filter-tools"><input id="host-search" aria-label="Search hosts" placeholder="Find a host…" value="${esc(hostQuery)}" oninput="updateHostFilter('query',this.value)"><select aria-label="Filter hosts by state" onchange="updateHostFilter('state',this.value)"><option value="all" ${hostStateFilter==='all'?'selected':''}>Any state</option><option value="ok" ${hostStateFilter==='ok'?'selected':''}>Healthy</option><option value="degraded" ${hostStateFilter==='degraded'?'selected':''}>Needs attention</option><option value="offline" ${hostStateFilter==='offline'?'selected':''}>Offline</option></select><select aria-label="Filter hosts by group" onchange="updateHostFilter('group',this.value)"><option value="all">Any group</option>${groups.map(g=>`<option value="${esc(g)}" ${hostGroupFilter===g?'selected':''}>${esc(g)}</option>`).join('')}</select>${active?'<button onclick="clearHostFilters()">Clear filters</button>':''}<span class="filter-count" aria-live="polite">${rows.length} of ${hosts().length} hosts</span></div>`}
function showHostsState(state){hostStateFilter=state;page='hosts';render();window.scrollTo(0,0)}
function updateHostFilter(key,value){if(key==='query')hostQuery=value;else if(key==='state')hostStateFilter=value;else hostGroupFilter=value;render();if(key==='query'){const input=document.querySelector('#host-search');input?.focus();input?.setSelectionRange(value.length,value.length)}}
function clearHostFilters(){hostQuery='';hostStateFilter='all';hostGroupFilter='all';render()}
function hostRows(){return filteredHosts().map(h=>`<a class="host host-link service-row" href="#host/${h.id}" onclick="event.preventDefault();openHost(${h.id})"><span class="service-icon">${serviceIcon('system')}</span><div><h3>${esc(hname(h))}</h3><p class="meta">${esc(h.online?`Seen ${ago(h.last_seen)}`:`Last seen ${ago(h.last_seen)}`)}</p><div class="meta host-extra">${hostExtra(h)}</div></div>${statusBadge(h.state,status(h.state))}<span class="meta servicecount">${h.services?.total??0} services</span><span class="host-open service-arrow" aria-hidden="true">›</span></a>`).join('')||'<p>No matching hosts. Try another filter or clear filters.</p>'}
function issues(){const failing=demo?.overview?.failing??hosts().flatMap(h=>(h.failing||[]).map(service=>({host_id:h.id,host:hname(h),service,status_text:'Failed check'})));const offline=hosts().filter(h=>!h.online).map(h=>({host_id:h.id,host:hname(h),service:null,status_text:'Host is offline'}));const all=[...offline,...failing],rows=all.slice(0,3);return rows.length?`<div class="issues">${rows.map(x=>{if(x.service){const d=demo?.details?.[x.host_id],svc=d?.services?.find(s=>s.name===x.service);if(svc)return serviceRow({...svc,host_id:x.host_id,host:x.host||hname(d)})}const h=hosts().find(h=>h.id===x.host_id);return `<a class="service-row host-attention" href="#host/${x.host_id}" onclick="event.preventDefault();openHost(${x.host_id})"><span class="service-icon">${serviceIcon('system')}</span><span class="service-main"><strong>${esc(x.host)}</strong><small>Host offline · Last seen ${esc(ago(h?.last_seen))}</small>${hostLastFacts(h)}</span>${statusBadge('offline','Offline')}<span class="service-arrow" aria-hidden="true">›</span></a>`}).join('')}</div>${all.length>3?`<div class="attention-more"><button onclick="navigate('services')">View all ${failing.length} failing services</button></div>`:''}`:'<p class="healthy">All reporting hosts are healthy.</p>'}
function chart(title,series,labels){const pts=series.map(s=>({name:s.name,color:s.color,values:s.points||[]})).filter(s=>s.values.length);if(!pts.length)return `<section class="chartbox"><h3>${title}</h3><p class="meta">No ${title.toLowerCase()} history in this snapshot.</p></section>`;const all=pts.flatMap(s=>s.values),ts=all.map(p=>p[0]),vals=all.map(p=>p[1]).filter(Number.isFinite);let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min=Math.min(0,min);max+=1}const pad=(max-min)*.12;min=Math.max(0,min-pad);max+=pad;const W=720,H=188,L=4,R=12,T=12,B=8,x=t=>L+(t-Math.min(...ts))/(Math.max(...ts)-Math.min(...ts)||1)*(W-L-R),y=v=>T+(max-v)/(max-min)*(H-T-B);const axis=[max,(max+min)/2,min].map(v=>v.toFixed(max<10?1:0));const grids=[0,.5,1].map(k=>`<line x1="${L}" y1="${y(max-k*(max-min))}" x2="${W-R}" y2="${y(max-k*(max-min))}" stroke="var(--line)"/>`).join('');const paths=pts.map(s=>`<polyline points="${s.values.map(p=>`${x(p[0])},${y(p[1])}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`).join('');const first=new Date(Math.min(...ts)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),last=new Date(Math.max(...ts)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return `<section class="chartbox"><div class="charttitle"><h3>${title}</h3><span class="legend">${pts.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</span></div><div class="chart"><div class="chart-y">${axis.map(v=>`<span>${v}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title} time series">${grids}${paths}</svg><div class="chart-times"><span>${first}</span><span>${last}</span></div></div></section>`}
function overviewChart(){const rows=demo?.overview?.activity||[];return chart('Fleet activity · last 24 hours',[{name:'Changes',color:'var(--blue)',points:rows.map(a=>[a.ts,a.ok])},{name:'Failures',color:'var(--red)',points:rows.map(a=>[a.ts,a.failed])}])}
function render(){const activePage=page==='host'?'hosts':page==='service'?'services':page==='event-detail'?'events':page==='setting-detail'?'settings':page;document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('current',b.dataset.page===activePage);b.setAttribute('aria-current',b.dataset.page===activePage?'page':'false')});let html='';if(page==='overview'){const o=demo?.overview,h=hosts();html=header('Fleet overview','Host health and service checks.')+`<div class="statusline"><span><span class="dot ok"></span>${o?.hosts?.online??h.filter(x=>x.online).length} online</span><a class="hero-state warn-link" href="#hosts" onclick="showHostsState('degraded');return false">${o?.hosts?.degraded??h.filter(x=>x.state==='degraded').length} degraded</a><a class="hero-state offline-link" href="#hosts" onclick="showHostsState('offline');return false">${o?.hosts?.offline??h.filter(x=>!x.online).length} offline</a><a href="#services" onclick="navigate('services');return false">${o?.services?.total??h.reduce((n,x)=>n+(x.services?.total||0),0)} services</a></div>`;html+=concept==='watch'?`<div class="sectionhead"><h2>Needs attention</h2><span class="badge">${(o?.failing?.length??h.reduce((n,x)=>n+(x.failing?.length||0),0))+h.filter(x=>!x.online).length} items</span></div>${issues()}${overviewChart()}<section class="activity"><div class="sectionhead"><h2>Recent changes</h2><a class="quiet" href="#events" onclick="navigate('events');return false">All events</a></div>${activity()}</section>`:`${hostFilters()}<div id="hostrows">${hostRows()}</div>${overviewChart()}<details><summary>Recent changes</summary>${activity()}</details>`}
if(page==='hosts')html=header('Hosts','Check health, then open a host for its services and metrics.')+`${hostFilters()}<div id="hostrows">${hostRows()}</div>`;
if(page==='services')html=servicesPage();
if(page==='events'){const matches=filteredEvents();html=header('Events','What changed across your fleet.')+eventFilters()+`<p class="filter-count timeline-count">Showing ${Math.min(matches.length,60)} of ${matches.length} matching events</p><div id="eventrows">${eventRows(matches.slice(0,60))}</div>`}
if(page==='event-detail'){const e=(demo?.events??demo?.overview?.recent_events??[]).find(x=>String(x.id)===String(selectedEventId));if(e){const date=new Date(e.created_at*1000),linkService=e.host_id!=null&&e.service?Object.values(demo?.details||{}).find(d=>d.id===e.host_id)?.services?.find(s=>s.name===e.service):null;html=`<button class="back" onclick="navigate('events')">‹ All events</button>`+header(e.message||e.kind_label||e.kind,`${date.toLocaleString()} · ${e.kind_label||e.kind}`)+`<section class="event-detail"><div class="event-detail-state">${statusBadge(e.state,({succeeded:'Recovered',ok:'Healthy',failed:'Failed',pending:'Pending',changed:'Changed',changed_not:'No change'})[e.state]||'Stale')}</div><dl><dt>When</dt><dd>${esc(date.toLocaleString())}</dd><dt>Event</dt><dd>${esc(e.kind_label||e.kind)}</dd><dt>Host</dt><dd>${esc(e.host||'—')}</dd><dt>Service</dt><dd>${esc(e.service||'—')}</dd><dt>Source</dt><dd>${esc(e.source||'—')}</dd></dl><div class="event-related">${linkService?`<a class="service-row" href="#service/${e.host_id}/${linkService.id}" onclick="event.preventDefault();openService(${e.host_id},${linkService.id})"><span class="service-icon">${serviceIcon(linkService.type)}</span><span class="service-main"><strong>Open ${esc(linkService.name)}</strong><small>${esc(linkService.host||e.host)} · ${esc(linkService.type)}</small></span><span class="service-arrow">›</span></a>`:e.host_id!=null?`<a class="service-row" href="#host/${e.host_id}" onclick="event.preventDefault();openHost(${e.host_id})"><span class="service-icon">${serviceIcon('system')}</span><span class="service-main"><strong>Open ${esc(e.host||'host')}</strong><small>View host details</small></span><span class="service-arrow">›</span></a>`:''}</div></section>`}};
if(page==='settings'){const sections=[['Account','Profile, password and API access','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'],['Appearance','Theme and text size','<path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="8"/>'],['Hosts & connections','Agent access and reporting','<rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/>'],['Notifications','Channels and delivery rules','<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>'],['Administration','Users, retention and collector setup','<path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="5"/>']];html=header('Settings','Choose what you want to manage.')+`<div class="settings-grid">${sections.map(([name,desc,path])=>`<button class="settings-card" onclick="openSetting('${name}')"><span class="settings-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg></span><span><strong>${name}</strong><small>${desc}</small></span><span class="settings-arrow" aria-hidden="true">›</span></button>`).join('')}</div>`}
if(page==='setting-detail')html=`<button class="back" onclick="navigate('settings')">‹ All settings</button>`+header(settingSection,'Illustrative settings for this design study.')+`<p class="note">This preview shows where ${esc(settingSection.toLowerCase())} options will live. Settings are not editable here.</p>`;content.innerHTML=html}
function updateServiceFilter(key,value){if(key==='query')servicesQuery=value;else if(key==='state')serviceStateFilter=value;else if(key==='host')serviceHostFilter=value;else serviceTypeFilter=value;servicePages={};render();if(key==='query'){const input=document.querySelector('#service-search');input?.focus();input?.setSelectionRange(value.length,value.length)}}
function clearServiceFilters(){servicesQuery='';serviceStateFilter=serviceHostFilter=serviceTypeFilter='all';servicePages={};render()}
function serviceGroup(title,items,key,{stale=false,failed=false,expanded=false}={}){const pageNum=servicePages[key]||0,pages=Math.max(1,Math.ceil(items.length/20)),current=Math.min(pageNum,pages-1),shown=items.slice(current*20,(current+1)*20),rows=shown.map(s=>serviceRow(s,{stale})).join('')||'<p class="meta service-empty">No matching services.</p>',pager=pages>1?`<div class="service-pager"><span>Page ${current+1} of ${pages}</span><button ${current===0?'disabled':''} onclick="servicePages['${key}']=${current-1};render()">Previous</button><button ${current>=pages-1?'disabled':''} onclick="servicePages['${key}']=${current+1};render()">Next</button></div>`:'';return failed?`<section class="service-group"><div class="sectionhead"><h2>${title}</h2><span class="badge">${items.length} services</span></div><div class="service-list">${rows}</div>${pager}</section>`:`<details ${expanded?'open':''}><summary>${items.length} ${title}</summary><div class="service-list">${rows}</div>${pager}</details>`}
function servicesPage(){const all=Object.entries(demo?.details||{}).flatMap(([id,d])=>(d.services||[]).map(s=>({...s,host_id:+id,host:hname(d)})));const q=servicesQuery.trim().toLowerCase(),offlineIds=new Set(hosts().filter(h=>!h.online).map(h=>h.id)),matches=all.filter(s=>[s.name,s.host,s.type,s.state,s.status_text].join(' ').toLowerCase().includes(q)&&(serviceHostFilter==='all'||String(s.host_id)===serviceHostFilter)&&(serviceTypeFilter==='all'||s.type===serviceTypeFilter)&&(serviceStateFilter==='all'||(serviceStateFilter==='stale'?offlineIds.has(s.host_id):!offlineIds.has(s.host_id)&&s.state===(serviceStateFilter==='healthy'?'ok':serviceStateFilter))));const stale=matches.filter(s=>offlineIds.has(s.host_id)),reporting=matches.filter(s=>!offlineIds.has(s.host_id)),failing=reporting.filter(s=>s.state==='failed'),ok=reporting.filter(s=>s.state==='ok'),other=reporting.filter(s=>s.state!=='failed'&&s.state!=='ok'),active=q||serviceStateFilter!=='all'||serviceHostFilter!=='all'||serviceTypeFilter!=='all',hostOptions=[...new Map(all.map(s=>[s.host_id,s.host])).entries()].sort((a,b)=>a[1].localeCompare(b[1])),types=[...new Set(all.map(s=>s.type))].sort();return header('Services','Find a check or open it to see its reported details.')+`<div class="filter-tools"><input id="service-search" aria-label="Search services" placeholder="Find a service…" value="${esc(servicesQuery)}" oninput="updateServiceFilter('query',this.value)"><select aria-label="Filter services by state" onchange="updateServiceFilter('state',this.value)"><option value="all" ${serviceStateFilter==='all'?'selected':''}>Any state</option>${[['failed','Failed'],['healthy','Healthy'],['pending','Pending'],['unmonitored','Unmonitored'],['stale','Stale']].map(([v,l])=>`<option value="${v}" ${serviceStateFilter===v?'selected':''}>${l}</option>`).join('')}</select><select aria-label="Filter services by host" onchange="updateServiceFilter('host',this.value)"><option value="all">Any host</option>${hostOptions.map(([id,n])=>`<option value="${id}" ${serviceHostFilter===String(id)?'selected':''}>${esc(n)}</option>`).join('')}</select><select aria-label="Filter services by type" onchange="updateServiceFilter('type',this.value)"><option value="all">Any type</option>${types.map(t=>`<option value="${esc(t)}" ${serviceTypeFilter===t?'selected':''}>${esc(t)}</option>`).join('')}</select>${active?'<button onclick="clearServiceFilters()">Clear filters</button>':''}<span class="filter-count" aria-live="polite">${matches.length} services</span></div>${failing.length?serviceGroup('Failing',failing,'failed',{failed:true}):''}${serviceGroup('healthy services',ok,'healthy',{expanded:!!q||serviceStateFilter==='healthy'})}${serviceGroup('stale services on offline hosts',stale,'stale',{stale:true,expanded:!!q||serviceStateFilter==='stale'})}${serviceGroup('other services',other,'other',{expanded:!!q||['pending','unmonitored'].includes(serviceStateFilter)})}`}
function filteredEvents(){const all=demo?.events??demo?.overview?.recent_events??[],q=eventQuery.trim().toLowerCase();return [...all].filter(e=>[e.message,e.kind_label,e.kind,e.host,e.service].filter(Boolean).join(' ').toLowerCase().includes(q)&&(eventHostFilter==='all'||String(e.host_id)===eventHostFilter)&&(eventStateFilter==='all'||(eventStateFilter==='changed'?(e.state==='changed'||e.state==='changed_not'):eventStateFilter==='ok'?(e.state==='ok'||e.state==='succeeded'):e.state===eventStateFilter))).sort((a,b)=>b.created_at-a.created_at)}
function eventFilters(){const matches=filteredEvents(),hostsWithEvents=[...new Map((demo?.events??demo?.overview?.recent_events??[]).filter(e=>e.host_id!=null).map(e=>[e.host_id,e.host])).entries()].sort((a,b)=>String(a[1]).localeCompare(String(b[1]))),active=eventQuery||eventStateFilter!=='all'||eventHostFilter!=='all';return `<div class="filter-tools"><input id="event-search" aria-label="Search events" placeholder="Find an event…" value="${esc(eventQuery)}" oninput="updateEventFilter('query',this.value)"><select aria-label="Filter events by state" onchange="updateEventFilter('state',this.value)"><option value="all" ${eventStateFilter==='all'?'selected':''}>Any state</option>${[['ok','Healthy / recovered'],['failed','Failed'],['pending','Pending'],['changed','Changed']].map(([v,l])=>`<option value="${v}" ${eventStateFilter===v?'selected':''}>${l}</option>`).join('')}</select><select aria-label="Filter events by host" onchange="updateEventFilter('host',this.value)"><option value="all">Any host</option>${hostsWithEvents.map(([id,n])=>`<option value="${id}" ${eventHostFilter===String(id)?'selected':''}>${esc(n||'Unknown host')}</option>`).join('')}</select>${active?'<button onclick="clearEventFilters()">Clear filters</button>':''}<span class="filter-count" aria-live="polite">${matches.length} events</span></div>`}
function updateEventFilter(key,value){if(key==='query')eventQuery=value;else if(key==='state')eventStateFilter=value;else eventHostFilter=value;render();if(key==='query'){const input=document.querySelector('#event-search');input?.focus();input?.setSelectionRange(value.length,value.length)}}
function clearEventFilters(){eventQuery='';eventStateFilter=eventHostFilter='all';render()}


function openEvent(id){selectedEventId=id;page='event-detail';render();window.scrollTo(0,0)}function openSetting(name){settingSection=name;page='setting-detail';render();window.scrollTo(0,0)}function navigate(p){page=p;render();window.scrollTo(0,0)}function openHost(id){const h=hosts().find(x=>x.id===id)||hosts().find(x=>hname(x)===id),d=demo?.details?.[id]||demo?.details?.[String(id)];if(!h)return;page='host';render();content.innerHTML=`<button class="back" onclick="navigate('hosts')">‹ All hosts</button>`+header(hname(h),`${status(h.state)} · Last report ${ago(h.last_seen)}`,hostFacts(h))+`<div class="detailnav"><button aria-pressed="true" onclick="showTab('services',this)">Services</button><button onclick="showTab('metrics',this)">Metrics</button><button onclick="showTab('details',this)">Details</button></div><div id="hosttab"></div>`;window.currentHost={h,d};showTab('services')}
function openService(hostId,serviceId){const h=hosts().find(x=>x.id===Number(hostId)),d=demo?.details?.[hostId]||demo?.details?.[String(hostId)],s=d?.services?.find(x=>String(x.id)===String(serviceId)||x.name===serviceId);if(!h||!s)return;const stale=!h.online,info=serviceInfo(s),state=stale?'stale':s.state;page='service';render();const statusLine=stale?`Last reported as ${status(s.state)} · Host offline`:status(s.state);content.innerHTML=`<button class="back" onclick="openHost(${h.id})">‹ ${esc(hname(h))}</button>`+header(s.name,`${statusLine} · ${s.type}`)+`<section class="service-detail"><div class="service-detail-title"><span class="service-icon large">${serviceIcon(s.type)}</span><div><h2>${esc(s.name)}</h2><p class="meta">${esc(hname(h))} · ${esc(s.type)}</p></div>${statusBadge(state,status(state))}</div><p class="service-status-text">${esc(stale?`Last reported: ${s.status_text||status(s.state)}`:s.status_text||'No status text reported.')}</p>${info.text?`<div class="service-facts">${info.text.split(' · ').map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:'<p class="note">No additional check data was reported for this service.</p>'}${info.usage!=null?`<div class="service-meter large-meter" aria-label="${shortNum(info.usage,1)} percent used"><i style="width:${info.usage}%"></i></div>`:''}<p class="meta">Last checked ${esc(ago(s.collected_at))}</p></section>`}
function showTab(tab,button){if(button)document.querySelectorAll('.detailnav button').forEach(b=>b.setAttribute('aria-pressed',b===button));const {h,d}=window.currentHost||{};const el=document.querySelector('#hosttab');if(!el)return;if(tab==='services'){const ss=d?.services||[];el.innerHTML=`<h2>Service health</h2>${ss.length?`<div class="service-list">${ss.map(s=>serviceRow({...s,host_id:h.id,host:hname(h)},{stale:!h.online})).join('')}</div>`:'<p class="note">Service details are not available for this host in the snapshot.</p>'}`}else if(tab==='metrics'){const m=demo?.metrics?.[h.id],series=m?.series||[],get=k=>series.find(s=>s.metric===k)?.points||[];const curr=h.system||{},cpu=get('cpu'),mem=get('mem_percent'),load=get('load1');el.innerHTML=`<h2>Resource usage</h2>${!h.online?'<p class="meta">Last reported values. This host is offline.</p>':''}<div class="metric"><div>${metricIcon('CPU')}CPU<strong>${curr.cpu==null?'—':`${shortNum(curr.cpu,1)}%`}</strong></div><div>${metricIcon('Memory')}Memory<strong>${curr.mem_percent==null?'—':`${shortNum(curr.mem_percent,1)}%`}</strong></div><div>${metricIcon('Load')}Load<strong>${loadText(curr.load,0)}</strong></div></div>${chart('CPU · %',[{name:'CPU',color:'var(--blue)',points:cpu}])}${chart('Memory · %',[{name:'Memory',color:'var(--green)',points:mem}])}${chart('Load · 1 minute',[{name:'Load',color:'var(--red)',points:load}])}`}else{el.innerHTML=`<h2>Host details</h2><div class="setting">Operating system<span>${esc([h.os?.name,h.os?.release].filter(Boolean).join(' ')||'—')}</span></div><div class="setting">Agent version<span>${esc(h.monit_version||'—')}</span></div><div class="setting">Host groups<span>${esc((h.hostgroups||[]).join(', ')||'—')}</span></div><div class="setting">Report received<span>${esc(ago(h.last_seen))}</span></div>`}}
document.getElementById('character').onclick=()=>{const on=document.body.classList.toggle('character');document.getElementById('character').setAttribute('aria-pressed',on);document.getElementById('character').textContent=on?'Character':'Plain'};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));for(const id of ['watch','fleet'])document.getElementById(id).onclick=()=>{concept=id;page='overview';document.getElementById('watch').setAttribute('aria-pressed',id==='watch');document.getElementById('fleet').setAttribute('aria-pressed',id==='fleet');render()};document.getElementById('theme').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);document.getElementById('theme').textContent=dark?'Light':'Dark'};function resize(){document.body.classList.toggle('mobile',phone||innerWidth<760);document.getElementById('viewport').classList.toggle('frame',phone&&innerWidth>=760)}document.getElementById('phone').onclick=()=>{phone=!phone;document.getElementById('phone').setAttribute('aria-pressed',phone);resize()};window.onresize=resize;resize();render();
