[package]
name = "monarchctl"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Command line and terminal UI to administer Monarch and see the status of your Monit hosts"
repository = "https://github.com/pschmitt/monarch"

# A standalone crate: not a member of the server's package, with its own lock file.
[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
toml = "1"
unicode-width = "0.2"

[profile.release]
codegen-units = 1
lto = true
strip = true
